<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARcry beats</title>
  <style>
    :root { --bg: #0d0d0f; --card: #17171b; --text: #eee; --accent: #ff4d4d; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 20px; text-align: center; }
    h1 { font-size: 3rem; margin: 0 0 8px; letter-spacing: 1px; }
    .tagline { color: #aaa; margin-bottom: 24px; }
    .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
           padding: 12px 28px; border-radius: 999px; font-weight: 600; transition: transform .15s; }
    .btn:hover { transform: scale(1.05); }
    section { background: var(--card); border-radius: 16px; padding: 24px; margin-top: 32px; }
    h2 { margin: 0 0 16px; }
    .row { display: flex; gap: 24px; align-items: center; }
    .col-video { flex: 1; min-width: 0; }
    .col-short { flex: 0 0 260px; }
    .video { aspect-ratio: 16 / 9; width: 100%; }
    .short { aspect-ratio: 9 / 16; width: 100%; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; }
    @media (max-width: 700px) {
      .row { flex-direction: column; }
      .col-short { flex: none; width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AR cry' beats</h1>
    <p class="tagline">Биты и музыка. listen, change, buy.</p>
    <a class="btn" href="https://youtube.com/@arkrai_rsq">Мой YouTube</a>

    <section>
      <div class="row">
        <div class="col-video">
          <h2>Beat</h2>
          <div class="video">
            <iframe src="https://www.youtube.com/embed/CY8PKOcg3H4" title="ARcry beat"
              allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
        <div class="col-short">
          <h2>Mix</h2>
          <div class="short">
            <iframe src="https://www.youtube.com/embed/LJXbea9_17M" title="ARcry shorts"
              allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
