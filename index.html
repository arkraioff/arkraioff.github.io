* { box-sizing: border-box; }
body {
  margin: 0;

.wrap { max-width: 1000px; margin: 0 auto; padding: 72px 20px; text-align: center; }

h1 {
  font-size: clamp(2rem, 7vw, 4.2rem);
  font-weight: 300;
  letter-spacing: .25em;
  text-transform: uppercase;
  margin: 0;
}
h1::after {
  content: "";
  display: block;
  width: 48px;
  height: 2px;
  background: var(--accent);
  margin: 24px auto 0;
}
.tagline { color: var(--muted); letter-spacing: .2em; font-size: .85rem; margin: 20px 0 32px; }

.btn {
  display: inline-block;
  color: var(--text);
  text-decoration: none;
  border: 1px solid var(--text);
  padding: 12px 32px;
  font-size: .8rem;
  letter-spacing: .25em;
  text-transform: uppercase;
  transition: all .25s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); letter-spacing: .32em; }

section { border: 1px solid var(--line); padding: 28px; margin-top: 56px; }
h2 {
  margin: 0 0 20px;
  font-size: .8rem;
  font-weight: 400;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--muted);
}

.row { display: flex; gap: 28px; align-items: flex-start; }
.col-video { flex: 1; min-width: 0; }
.col-short { flex: 0 0 260px; }
.video { aspect-ratio: 16 / 9; width: 100%; }
.short { aspect-ratio: 9 / 16; width: 100%; }

iframe { width: 100%; height: 100%; border: 0; filter: grayscale(.5); transition: filter .4s; }
iframe:hover { filter: grayscale(0); }

@media (max-width: 700px) {
  .row { flex-direction: column; align-items: center; }
  .col-short { flex: none; width: 100%; max-width: 280px; }
  body::after {

  position: fixed;
  left: 3vw;

  z-index: -1;

  opacity: .3;

  -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 70%);
  mask-image: radial-gradient(ellipse at center, #000 25%, transparent 70%);
}

@media (max-width: 700px) {
  body::after { width: 200px; height: 280px; opacity: .2; }
}
